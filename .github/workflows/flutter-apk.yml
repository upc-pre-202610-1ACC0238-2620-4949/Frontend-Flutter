name: Build Flutter APK

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartGas-Flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Sube el APK a Firebase App Distribution (solo en main, y solo si el repo tiene los secretos configurados).
      # Secretos: FIREBASE_APP_ID (ID de la app en Firebase) y FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio).
      # Los testers se gestionan en la consola de Firebase, en el grupo "docentes".
      - name: Distribute with Firebase App Distribution
        if: github.ref == 'refs/heads/main' && env.FIREBASE_APP_ID != ''
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          npx --yes firebase-tools@latest appdistribution:distribute "build/app/outputs/flutter-apk/app-debug.apk" \
            --app "$FIREBASE_APP_ID" \
            --groups "docentes" \
            --release-notes "SmartGas ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
